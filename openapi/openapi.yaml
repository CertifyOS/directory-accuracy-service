---
openapi: 3.1.0
tags:
- name: internal
- name: vendor-exports
- name: vendor-ingestion
- name: vendor-review
components:
  schemas:
    AttachRequest:
      type: object
      properties:
        exportBatchId:
          type: string
        reason:
          type: string
    AttachResponse:
      type: object
      properties:
        uploadId:
          type: string
        state:
          type: string
        jobId:
          type: string
    BulkDecisionBody:
      type: object
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/DecisionItem"
    BulkDecisionView:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/DecisionResultView"
    BulkReleaseAccepted:
      type: object
      properties:
        releases:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseSummary"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/SkippedItem"
    BulkReleaseRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
        versions:
          type: object
          additionalProperties:
            type: integer
            format: int64
        exportBatchId:
          type: string
        all:
          type: boolean
    CadenceRequest:
      type: object
      properties:
        type:
          type: string
        dayOfMonth:
          type: integer
          format: int32
        expression:
          type: string
    ClauseRequest:
      type: object
      properties:
        eq:
          type: string
        in:
          type: array
          items:
            type: string
        gte:
          type: string
        lte:
          type: string
    DecisionBody:
      type: object
      properties:
        action:
          type: string
        comment:
          type: string
        version:
          type: integer
          format: int64
    DecisionItem:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
        comment:
          type: string
        version:
          type: integer
          format: int64
    DecisionResultView:
      type: object
      properties:
        id:
          type: string
        status:
          type: integer
          format: int32
        code:
          type: string
        document:
          $ref: "#/components/schemas/FieldView"
    DisableRequest:
      type: object
      properties:
        reason:
          type: string
    DiscardRequest:
      type: object
      properties:
        reason:
          type: string
    EnableRequest:
      type: object
      properties:
        reason:
          type: string
        catchUp:
          type: boolean
    FieldView:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        sourceType:
          type: string
        source:
          type: string
        exportBatchId:
          type: string
        practitioner:
          $ref: "#/components/schemas/Practitioner"
        location:
          $ref: "#/components/schemas/Location"
        field:
          type: string
        sentValue:
          type: string
        vendorValue:
          type: string
        vendorStatus:
          type: string
        vendorReason:
          type: array
          items:
            type: string
        vendorConfidence:
          type: string
        vendorEvidence:
          type: array
          items:
            type: object
            additionalProperties: {}
        reviewStatus:
          type: string
        reviewHistory:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        version:
          type: integer
          format: int64
        goldenRecordUpdate:
          $ref: "#/components/schemas/GoldenRecordUpdate"
        sourceFile:
          $ref: "#/components/schemas/SourceFile"
        stagedAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
    GoldenRecordUpdate:
      type: object
      properties:
        releaseId:
          type: string
        requestedBy:
          type: string
        requestedAt:
          $ref: "#/components/schemas/Instant"
        writePath:
          type: string
        resource:
          type: string
        crosswalkId:
          type: string
        sliceId:
          type: string
        sentAt:
          $ref: "#/components/schemas/Instant"
        writtenAt:
          $ref: "#/components/schemas/Instant"
        deadlineJobId:
          type: string
        outcome:
          type: string
        winningSource:
          type: string
        releasedAt:
          $ref: "#/components/schemas/Instant"
        error:
          type: string
    HistoryEntry:
      type: object
      properties:
        action:
          type: string
        by:
          type: string
        at:
          $ref: "#/components/schemas/Instant"
        comment:
          type: string
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    Location:
      type: object
      properties:
        certifyLocationId:
          type: string
    Message:
      type: object
      properties:
        data:
          type: string
        messageId:
          type: string
        publishTime:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
    Practitioner:
      type: object
      properties:
        certifyPractitionerId:
          type: string
        npi:
          type: string
    PreviewRequest:
      type: object
      properties:
        selection:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ClauseRequest"
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
    PubSubPushMessage:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/Message"
        subscription:
          type: string
    PutRequest:
      type: object
      properties:
        version:
          type: integer
          format: int64
        cadence:
          $ref: "#/components/schemas/CadenceRequest"
        timezone:
          type: string
        selection:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ClauseRequest"
        egressTemplateId:
          type: string
    ReasonRequest:
      type: object
      properties:
        reason:
          type: string
    ReleaseAccepted:
      type: object
      properties:
        releaseId:
          type: string
    ReleaseRequest:
      type: object
      properties:
        version:
          type: integer
          format: int64
    ReleaseSummary:
      type: object
      properties:
        releaseId:
          type: string
        certifyPractitionerId:
          type: string
        fieldRecommendationIds:
          type: array
          items:
            type: string
    RetryResponse:
      type: object
      properties:
        exportBatchId:
          type: string
        attempt:
          type: integer
          format: int32
        jobId:
          type: string
    RollbackRequest:
      type: object
      properties:
        version:
          type: integer
          format: int64
        reason:
          type: string
    RunNowResponse:
      type: object
      properties:
        exportBatchId:
          type: string
        jobId:
          type: string
        nextDueAt:
          $ref: "#/components/schemas/Instant"
    ScheduleView:
      type: object
      properties:
        tenantId:
          type: string
        vendor:
          type: string
        enabled:
          type: boolean
        cadence:
          $ref: "#/components/schemas/CadenceRequest"
        timezone:
          type: string
        selection:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ClauseRequest"
        egressTemplateId:
          type: string
        nextDueAt:
          $ref: "#/components/schemas/Instant"
        lastBatchId:
          type: string
        lastRunAt:
          $ref: "#/components/schemas/Instant"
        disabledAt:
          $ref: "#/components/schemas/Instant"
        disabledReason:
          type: string
        version:
          type: integer
          format: int64
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
    SkippedItem:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
    SourceFile:
      type: object
      properties:
        uploadId:
          type: string
        sheet:
          type: string
        row:
          type: integer
          format: int32
    SupersedeResponse:
      type: object
      properties:
        exportBatchId:
          type: string
        jobId:
          type: string
  securitySchemes:
    platform-token:
      description: Auth0 platform access token. The tenant-id header selects the tenant.
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /internal/vendor-exports/egress-events:
    post:
      summary: Receive an egress completion event
      description: "Pub/Sub push endpoint. Requires the subscription's OIDC identity\
        \ token; answers 204 to acknowledge, including for a message it cannot parse."
      tags:
      - internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PubSubPushMessage"
        required: true
      responses:
        "204":
          description: Acknowledged
        "401":
          description: "Missing, rejected or not yet configured push identity (PUSH_TOKEN_REQUIRED,\
            \ PUSH_TOKEN_REJECTED, PUSH_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad Request
  /internal/vendor-ingestion/arrivals:
    post:
      summary: Receive a vendor bucket storage notification
      description: "Pub/Sub push endpoint for object notifications under the vendor\
        \ bucket. Requires the subscription's OIDC identity token; reads the message\
        \ attributes only and answers 204 to acknowledge every outcome, including\
        \ an event it ignores or cannot match; answers 503 while the service is switched\
        \ off so the message is redelivered."
      tags:
      - internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PubSubPushMessage"
        required: true
      responses:
        "204":
          description: Acknowledged
        "503":
          description: The service is switched off (SERVICE_DISABLED); Pub/Sub redelivers
            the message
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "Missing, rejected or not yet configured push identity (PUSH_TOKEN_REQUIRED,\
            \ PUSH_TOKEN_REJECTED, PUSH_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad Request
  /internal/vendor-ingestion/completions:
    post:
      summary: Receive a file-ingestion completion event
      description: "Pub/Sub push endpoint for file-ingestion's completion events on\
        \ this consumer's topic. Requires the subscription's OIDC identity token;\
        \ reads the base64 event body, finds the inbound file by externalRef and records\
        \ the parse outcome. Answers 204 to acknowledge every outcome, including an\
        \ event it cannot read or match, and 503 while the ingestion request for the\
        \ file is not committed yet, so the event is delivered again."
      tags:
      - internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PubSubPushMessage"
        required: true
      responses:
        "204":
          description: Acknowledged
        "401":
          description: "Missing, rejected or not yet configured push identity (PUSH_TOKEN_REQUIRED,\
            \ PUSH_TOKEN_REJECTED, PUSH_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: The inbound file's ingestion request is not committed yet;
            redeliver (ARCHIVING_NOT_COMMITTED)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad Request
  /internal/vendor-ingestion/ov-generated:
    post:
      summary: Receive a survivorship operational-value event
      description: "Pub/Sub push endpoint for mdm.slice.ov_generated. Requires the\
        \ subscription's OIDC identity token; reads the operational value back for\
        \ fields released through a candor slice and answers 204 to acknowledge every\
        \ outcome, including an event that is not ours; answers 503 while the service\
        \ is switched off so the message is redelivered."
      tags:
      - internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PubSubPushMessage"
        required: true
      responses:
        "204":
          description: Acknowledged
        "503":
          description: The service is switched off (SERVICE_DISABLED); Pub/Sub redelivers
            the message
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "Missing, rejected or not yet configured push identity (PUSH_TOKEN_REQUIRED,\
            \ PUSH_TOKEN_REJECTED, PUSH_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad Request
  /v1/vendor-exports:
    get:
      summary: List export batches
      description: "Export batches of the tenant named by the tenant-id header, newest\
        \ first, at most 100; period narrows to one month."
      tags:
      - vendor-exports
      parameters:
      - name: period
        in: query
        schema:
          type: string
      - name: tenantId
        in: query
        schema:
          type: string
      responses:
        "400":
          description: "Invalid request (TENANT_REQUIRED, PERIOD_INVALID, REASON_REQUIRED,\
            \ INVALID_REQUEST)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant (TENANT_FORBIDDEN, TENANT_UNRESOLVED),\
            \ lacks the permission (PERMISSION_DENIED) or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such batch in the caller's tenant (BATCH_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Not in a state that allows the write (RETRY_NOT_ALLOWED, SUPERSEDE_NOT_ALLOWED,\
            \ BATCH_EXISTS, VERSION_STALE)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: User lookup failed (DAL_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules:
    get:
      summary: List export schedules
      description: Schedules of the tenant named by the tenant-id header.
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: query
        schema:
          type: string
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules/{tenantId}/{vendor}:
    put:
      summary: Create or replace an export schedule
      description: "No version in the body: create (201), or 409 SCHEDULE_EXISTS.\
        \ With version: replace (200), or 409 VERSION_STALE. Create provisions the\
        \ tenant's vendor template through api-layer and sets enabled; replace never\
        \ changes enabled. Cadence or timezone changes recompute nextDueAt."
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutRequest"
        required: true
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleView"
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleView"
      security:
      - platform-token: []
    get:
      summary: Read an export schedule
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        in: path
        required: true
        schema:
          type: string
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules/{tenantId}/{vendor}/disable:
    post:
      summary: Disable an export schedule
      description: The tick skips the schedule until enable. Reason is mandatory.
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableRequest"
        required: true
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules/{tenantId}/{vendor}/enable:
    post:
      summary: Enable an export schedule
      description: catchUp true sets nextDueAt to the most recent occurrence missed
        while disabled; false to the next future one.
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableRequest"
        required: true
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules/{tenantId}/{vendor}/events:
    get:
      summary: Read a schedule's audit trail
