  /v1/vendor-review/fields:
    get:
      summary: List field recommendations
      description: "One page of the tenant's field recommendations, newest staged\
        \ first, filtered by field, review status (repeatable, default PENDING), NPI\
        \ and export batch. Pages by keyset: pass the previous page's next as after;\
        \ a row decided between two pages never shifts another across the cursor.\
        \ limit is 10 to the configured maximum (200), default 50."
      tags:
      - vendor-review
      parameters:
      - name: after
        in: query
        schema:
          type: string
      - name: exportBatchId
        in: query
        schema:
          type: string
      - name: field
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: npi
        in: query
        schema:
          type: string
      - name: reviewStatus
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        "400":
          description: "Invalid request (TENANT_REQUIRED, INVALID_REQUEST, FIELD_UNKNOWN,\
            \ VERSION_REQUIRED, COMMENT_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant (TENANT_FORBIDDEN, TENANT_UNRESOLVED)\
            \ or lacks the permission (PERMISSION_DENIED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: User lookup failed (DAL_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
