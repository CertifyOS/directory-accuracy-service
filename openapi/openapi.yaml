---
openapi: 3.1.0
tags:
- name: internal
- name: vendor-exports
- name: vendor-ingestion
- name: vendor-review
components:
  schemas:
    AttachRequest:
      type: object
      properties:
        exportBatchId:
          type: string
        reason:
          type: string
    AttachResponse:
      type: object
      properties:
        uploadId:
          type: string
        state:
          type: string
        jobId:
          type: string
    CadenceRequest:
      type: object
      properties:
        type:
          type: string
        dayOfMonth:
          type: integer
          format: int32
        expression:
          type: string
    ClauseRequest:
      type: object
      properties:
        eq:
          type: string
        in:
          type: array
          items:
            type: string
        gte:
          type: string
        lte:
          type: string
    DisableRequest:
      type: object
      properties:
        reason:
          type: string
    DiscardRequest:
      type: object
      properties:
        reason:
          type: string
    EnableRequest:
      type: object
      properties:
        reason:
          type: string
        catchUp:
          type: boolean
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    Message:
      type: object
      properties:
        data:
          type: string
        messageId:
          type: string
        publishTime:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
    PreviewRequest:
      type: object
      properties:
        selection:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ClauseRequest"
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
    PubSubPushMessage:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/Message"
        subscription:
          type: string
    PutRequest:
      type: object
      properties:
        version:
          type: integer
          format: int64
        cadence:
          $ref: "#/components/schemas/CadenceRequest"
        timezone:
          type: string
        selection:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ClauseRequest"
        egressTemplateId:
          type: string
    ReasonRequest:
      type: object
      properties:
        reason:
          type: string
    RetryResponse:
      type: object
      properties:
        exportBatchId:
          type: string
        attempt:
          type: integer
          format: int32
        jobId:
          type: string
    RunNowResponse:
      type: object
      properties:
        exportBatchId:
          type: string
        jobId:
          type: string
        nextDueAt:
          $ref: "#/components/schemas/Instant"
    ScheduleView:
      type: object
      properties:
        tenantId:
          type: string
        vendor:
          type: string
        enabled:
          type: boolean
        cadence:
          $ref: "#/components/schemas/CadenceRequest"
        timezone:
          type: string
        selection:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ClauseRequest"
        egressTemplateId:
          type: string
        nextDueAt:
          $ref: "#/components/schemas/Instant"
        lastBatchId:
          type: string
        lastRunAt:
          $ref: "#/components/schemas/Instant"
        disabledAt:
          $ref: "#/components/schemas/Instant"
        disabledReason:
          type: string
        version:
          type: integer
          format: int64
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
    SupersedeResponse:
      type: object
      properties:
        exportBatchId:
          type: string
        jobId:
          type: string
  securitySchemes:
    platform-token:
      description: Auth0 platform access token. The tenant-id header selects the tenant.
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /internal/vendor-exports/egress-events:
    post:
      summary: Receive an egress completion event
      description: "Pub/Sub push endpoint. Requires the subscription's OIDC identity\
        \ token; answers 204 to acknowledge, including for a message it cannot parse."
      tags:
      - internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PubSubPushMessage"
        required: true
      responses:
        "204":
          description: Acknowledged
        "401":
          description: "Missing, rejected or not yet configured push identity (PUSH_TOKEN_REQUIRED,\
            \ PUSH_TOKEN_REJECTED, PUSH_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad Request
  /internal/vendor-ingestion/arrivals:
    post:
      summary: Receive a vendor bucket storage notification
      description: "Pub/Sub push endpoint for object notifications under the vendor\
        \ bucket. Requires the subscription's OIDC identity token; reads the message\
        \ attributes only and answers 204 to acknowledge every outcome, including\
        \ an event it ignores or cannot match."
      tags:
      - internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PubSubPushMessage"
        required: true
      responses:
        "204":
          description: Acknowledged
        "401":
          description: "Missing, rejected or not yet configured push identity (PUSH_TOKEN_REQUIRED,\
            \ PUSH_TOKEN_REJECTED, PUSH_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: Bad Request
  /v1/vendor-exports:
    get:
      summary: List export batches
      description: "Export batches of the tenant named by the tenant-id header, newest\
        \ first, at most 100; period narrows to one month."
      tags:
      - vendor-exports
      parameters:
      - name: period
        in: query
        schema:
          type: string
      - name: tenantId
        in: query
        schema:
          type: string
      responses:
        "400":
          description: "Invalid request (TENANT_REQUIRED, PERIOD_INVALID, REASON_REQUIRED,\
            \ INVALID_REQUEST)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant (TENANT_FORBIDDEN, TENANT_UNRESOLVED),\
            \ lacks the permission (PERMISSION_DENIED) or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such batch in the caller's tenant (BATCH_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Not in a state that allows the write (RETRY_NOT_ALLOWED, SUPERSEDE_NOT_ALLOWED,\
            \ BATCH_EXISTS, VERSION_STALE)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: User lookup failed (DAL_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules:
    get:
      summary: List export schedules
      description: Schedules of the tenant named by the tenant-id header.
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: query
        schema:
          type: string
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules/{tenantId}/{vendor}:
    put:
      summary: Create or replace an export schedule
      description: "No version in the body: create (201), or 409 SCHEDULE_EXISTS.\
        \ With version: replace (200), or 409 VERSION_STALE. Create provisions the\
        \ tenant's vendor template through api-layer and sets enabled; replace never\
        \ changes enabled. Cadence or timezone changes recompute nextDueAt."
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutRequest"
        required: true
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleView"
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleView"
      security:
      - platform-token: []
    get:
      summary: Read an export schedule
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        in: path
        required: true
        schema:
          type: string
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules/{tenantId}/{vendor}/disable:
    post:
      summary: Disable an export schedule
      description: The tick skips the schedule until enable. Reason is mandatory.
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableRequest"
        required: true
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules/{tenantId}/{vendor}/enable:
    post:
      summary: Enable an export schedule
      description: catchUp true sets nextDueAt to the most recent occurrence missed
        while disabled; false to the next future one.
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableRequest"
        required: true
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules/{tenantId}/{vendor}/events:
    get:
      summary: Read a schedule's audit trail
      description: "The schedule-scoped events (no batch id), newest first, at most\
        \ 200. A batch's own events are under /v1/vendor-exports/{exportBatchId}/events."
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        in: path
        required: true
        schema:
          type: string
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules/{tenantId}/{vendor}/preview:
    post:
      summary: Preview a selection
      description: Runs the selection against api-layer with page size 1 and returns
        totalCount.
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
        required: true
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
