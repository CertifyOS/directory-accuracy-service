  /v1/vendor-review/fields/{id}/decision:
    post:
      summary: "Approve, reject or skip a field recommendation"
      description: "action is APPROVE, REJECT or SKIP; comment is required on REJECT;\
        \ version is the one the reviewer read. APPROVE and REJECT go from PENDING\
        \ or SKIPPED, SKIP from PENDING; APPROVED and REJECTED are final. One guarded\
        \ update with its audit event; a state that does not allow the action, a stale\
        \ version or a lost race answers 409 with the current state and who decided\
        \ last."
      tags:
      - vendor-review
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
