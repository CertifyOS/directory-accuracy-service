                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/schedules/{tenantId}/{vendor}/run-now:
    post:
      summary: Run an export schedule now
      description: "Creates the current period's batch as the tick would, advances\
        \ nextDueAt and enqueues the select job. 409 BATCH_EXISTS when the period\
        \ already has its batch, SCHEDULE_DISABLED when the schedule is disabled."
      tags:
      - vendor-exports
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: vendor
        in: path
        required: true
        schema:
          type: string
      responses:
        "400":
          description: "Invalid request (SELECTION_INVALID, CADENCE_INVALID, TIMEZONE_INVALID,\
            \ INVALID_REQUEST, TEMPLATE_NOT_FOUND, TEMPLATE_WRONG_ENTITY, REASON_REQUIRED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant, lacks the permission,\
            \ or named another tenant (TENANT_MISMATCH)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such schedule (SCHEDULE_NOT_FOUND)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Exists, stale version, already enabled or disabled, ambiguous\
            \ template (SCHEDULE_EXISTS, VERSION_STALE, ALREADY_ENABLED, ALREADY_DISABLED,\
            \ TEMPLATE_AMBIGUOUS, BATCH_EXISTS, SCHEDULE_DISABLED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "DAL or api-layer unavailable or not configured (DAL_UNAVAILABLE,\
            \ API_LAYER_UNAVAILABLE, API_LAYER_NOT_CONFIGURED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "201":
          description: Batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunNowResponse"
      security:
      - platform-token: []
  /v1/vendor-exports/tick:
    post:
      summary: Run the export tick now
      description: Runs the daily schedule tick inline and returns its counts. Same
        code path as the 06:00 UTC recurring job.
      tags:
      - vendor-exports
      responses:
        "400":
          description: tenant-id header missing (TENANT_REQUIRED)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No or invalid platform token
        "403":
          description: "Caller holds no role in the tenant (TENANT_FORBIDDEN, TENANT_UNRESOLVED)\
            \ or lacks the permission (PERMISSION_DENIED)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: User lookup failed (DAL_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - platform-token: []
  /v1/vendor-exports/{exportBatchId}:
    get:
      summary: Read an export batch
      description: The batch document minus internal job ids.
      tags:
      - vendor-exports
      parameters:
      - name: exportBatchId
        in: path
        required: true
        schema:
          type: string
