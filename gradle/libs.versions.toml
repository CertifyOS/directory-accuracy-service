# Version catalog: the only place a version is written. build.gradle references libs.* and
# libs.plugins.*; Renovate bumps entries here. No SNAPSHOT and no mavenLocal() anywhere.

[versions]
quarkus = "3.33.3"            # pinned with JobRunr; gated by file-ingestion-service 2026-09-21
jobrunr = "8.8.2"
quarkiverse-secret-manager = "2.15.0"
quarkiverse-logging-sentry = "2.3.4"   # 2.1.3 fails to augment on Quarkus 3.33.3
google-cloud-storage = "2.45.0"
google-cloud-pubsub = "1.134.0"
google-auth = "1.30.0"        # resolves higher if the Google clients require it
java-uuid-generator = "5.1.0"
testcontainers = "1.20.4"
wiremock = "3.9.2"
awaitility = "4.2.2"
archunit = "1.4.1"
checkstyle = "10.21.0"
jacoco = "0.8.12"
spotless = "6.25.0"
spotbugs-plugin = "6.0.27"

[libraries]
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-rest = { module = "io.quarkus:quarkus-rest" }
quarkus-rest-jackson = { module = "io.quarkus:quarkus-rest-jackson" }
quarkus-rest-client-jackson = { module = "io.quarkus:quarkus-rest-client-jackson" }
quarkus-oidc = { module = "io.quarkus:quarkus-oidc" }
quarkus-security = { module = "io.quarkus:quarkus-security" }
quarkus-mongodb-client = { module = "io.quarkus:quarkus-mongodb-client" }
quarkus-cache = { module = "io.quarkus:quarkus-cache" }
quarkus-smallrye-health = { module = "io.quarkus:quarkus-smallrye-health" }
quarkus-smallrye-openapi = { module = "io.quarkus:quarkus-smallrye-openapi" }
quarkus-smallrye-fault-tolerance = { module = "io.quarkus:quarkus-smallrye-fault-tolerance" }
quarkus-micrometer-prometheus = { module = "io.quarkus:quarkus-micrometer-registry-prometheus" }
quarkus-opentelemetry = { module = "io.quarkus:quarkus-opentelemetry" }
quarkus-logging-json = { module = "io.quarkus:quarkus-logging-json" }
quarkus-google-cloud-secret-manager = { module = "io.quarkiverse.googlecloudservices:quarkus-google-cloud-secret-manager", version.ref = "quarkiverse-secret-manager" }
quarkus-logging-sentry = { module = "io.quarkiverse.loggingsentry:quarkus-logging-sentry", version.ref = "quarkiverse-logging-sentry" }
quarkus-jobrunr = { module = "org.jobrunr:quarkus-jobrunr", version.ref = "jobrunr" }
google-cloud-storage = { module = "com.google.cloud:google-cloud-storage", version.ref = "google-cloud-storage" }
google-cloud-pubsub = { module = "com.google.cloud:google-cloud-pubsub", version.ref = "google-cloud-pubsub" }
google-auth-oauth2-http = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "google-auth" }
java-uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "java-uuid-generator" }
# No version: the enforced Quarkus BOM pins commons-codec (1.21.0 on Quarkus 3.33.3) and would override one here.
commons-codec = { module = "commons-codec:commons-codec" }

quarkus-jacoco = { module = "io.quarkus:quarkus-jacoco" }
quarkus-junit = { module = "io.quarkus:quarkus-junit" }
quarkus-junit-mockito = { module = "io.quarkus:quarkus-junit-mockito" }
quarkus-test-security-jwt = { module = "io.quarkus:quarkus-test-security-jwt" }
rest-assured = { module = "io.rest-assured:rest-assured" }
testcontainers-mongodb = { module = "org.testcontainers:mongodb", version.ref = "testcontainers" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[bundles]
quarkus-runtime = [
  "quarkus-rest", "quarkus-rest-jackson", "quarkus-rest-client-jackson",
  "quarkus-oidc", "quarkus-security", "quarkus-mongodb-client", "quarkus-cache",
  "quarkus-smallrye-health", "quarkus-smallrye-openapi", "quarkus-smallrye-fault-tolerance",
  "quarkus-micrometer-prometheus", "quarkus-opentelemetry", "quarkus-logging-json",
]
quarkus-test = [
  "quarkus-jacoco", "quarkus-junit", "quarkus-junit-mockito", "quarkus-test-security-jwt",
  "rest-assured", "testcontainers-mongodb", "wiremock", "awaitility", "archunit-junit5",
]

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
