# vendor-exchange-service
#
# One image, two roles: QUARKUS_PROFILE=prod,api or prod,worker. RoleProfileCheck refuses to boot
# with neither or both. %worker is the only profile that runs the JobRunr server.
#
# Keys under vendor-exchange.* are a closed @ConfigMapping (VendorExchangeConfig): an undeclared key
# under that prefix is rejected at boot (SRCFG00050), and a declared key with no default must be set
# by the environment or the boot fails. Test values live in the test profiles, never here.

quarkus.package.jar.enabled=true
quarkus.package.jar.type=fast-jar
quarkus.http.port=${PORT:8080}
quarkus.shutdown.timeout=${SHUTDOWN_TIMEOUT:30}
# delay-enabled is fixed at build time (ShutdownBuildTimeConfig), so it is a literal, not an env var.
# The delay itself is runtime: readiness goes DOWN at once, the process keeps serving for this long
# so the load balancer stops routing before shutdown begins.
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=${SHUTDOWN_DELAY:10}

# Logging: JSON for Cloud Logging, with level renamed to severity. Plain text in dev and tests.
quarkus.log.console.json.enabled=true
quarkus.log.console.json.key-overrides=level=severity
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

# OpenTelemetry. The SDK is off unless the deployment turns it on and names a collector; otherwise
# the exporter logs connection errors against localhost:4317 on every boot (file-ingestion's
# experience). Sampling: parent-based ratio (playbook), 10% of new traces.
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=vendor-exchange-service
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=0.1

# Sentry. Off unless enabled; the DSN comes from the environment (Terraform injects the Secret
# Manager value in Step 8). Only ERROR and above become events; WARN lines ride along as breadcrumbs.
quarkus.log.sentry.enabled=${SENTRY_ENABLED:false}
quarkus.log.sentry.dsn=${SENTRY_DSN:}
quarkus.log.sentry.environment=${SENTRY_ENVIRONMENT:internal}
quarkus.log.sentry.in-app-packages=com.certifyos.vendor_exchange
quarkus.log.sentry.minimum-event-level=ERROR
quarkus.log.sentry.minimum-breadcrumb-level=WARN

# Metrics: Micrometer with the Prometheus endpoint at /q/metrics. Application metrics are the design's
# names (metrics/VendorExchangeMetrics); JVM and HTTP binders stay on.
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.http-server.enabled=true

# MongoDB. The connection string comes from the environment locally and from Secret Manager in prod.
# No default (playbook: required infrastructure values have no default); tests set it from the
# Testcontainers resource, local runs from .env.
quarkus.mongodb.connection-string=${MONGODB_URI}
quarkus.mongodb.database=vendor_exchange
quarkus.mongodb.uuid-representation=standard
# Readiness checks a real dependency: /q/health/ready pings MongoDB. The load balancer and the
# instance groups use /q/health/live, so a database blip never replaces a VM.
quarkus.mongodb.health.enabled=true
# Explicit, not a behaviour change: MongoDB 5.0+ already defaults a replica set to w:majority.
quarkus.mongodb.write-concern.w=majority
quarkus.mongodb.devservices.enabled=false
%prod.quarkus.mongodb.connection-string=${sm//vendor-exchange-mongodb-uri}

# Auth0 (operator endpoints). The default OIDC tenant stays disabled at the base level: local dev and
# CI have no AUTH0_ISSUER, and quarkus-oidc refuses to boot without either a real auth-server-url or
# tenant-enabled=false. %prod turns it on where the real values exist; a forgotten value then fails
# loud rather than booting misconfigured. Keycloak Dev Services are kept off as a second guard.
quarkus.oidc.tenant-enabled=false
quarkus.keycloak.devservices.enabled=false
%prod.quarkus.oidc.tenant-enabled=true
quarkus.oidc.auth-server-url=${AUTH0_ISSUER}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${AUTH0_AUDIENCE}

# HTTP-layer policy, deny by default (playbook): anything not listed below is refused. /q/* is health,
# metrics and OpenAPI. /internal/* is the Pub/Sub push endpoint, which verifies its own identity
# token (PubSubPushAuthFilter, Step 5), so it is permitted here and guarded there. Operator endpoints
# are versioned under /v1 from day one. The most specific path pattern wins.
quarkus.http.auth.permission.deny-all.paths=/*
quarkus.http.auth.permission.deny-all.policy=deny
quarkus.http.auth.permission.q.paths=/q/*
quarkus.http.auth.permission.q.policy=permit
quarkus.http.auth.permission.internal.paths=/internal/*
quarkus.http.auth.permission.internal.policy=permit
quarkus.http.auth.permission.api.paths=/v1/*
quarkus.http.auth.permission.api.policy=authenticated

# DAL REST client (user lookup for tenant membership). The URL is the same value the config mapping
# holds; the client key is what @RegisterRestClient(configKey = "dal") reads. Tests point it at
# WireMock through the test resource.
quarkus.rest-client.dal.url=${vendor-exchange.dal.url}
quarkus.rest-client.dal.scope=jakarta.inject.Singleton
quarkus.rest-client.dal.connect-timeout=5000
quarkus.rest-client.dal.read-timeout=10000

# Egress and api-layer REST clients (interfaces in clients/). URLs are the config mapping's values;
# EgressAuthFilter adds the IAP token, ApiLayerAuthFilter the Auth0 token. Reads may take a while on
# a large tenant page or a template upload, so the read timeout is longer than the DAL's.
quarkus.rest-client.egress.url=${vendor-exchange.egress.url}
quarkus.rest-client.egress.scope=jakarta.inject.Singleton
quarkus.rest-client.egress.connect-timeout=5000
quarkus.rest-client.egress.read-timeout=30000
quarkus.rest-client.api-layer.url=${vendor-exchange.api-layer.url}
quarkus.rest-client.api-layer.scope=jakarta.inject.Singleton
quarkus.rest-client.api-layer.connect-timeout=5000
quarkus.rest-client.api-layer.read-timeout=30000

# file-ingestion-service REST client (interface in clients/). The read timeout is long because the
# NDJSON stream of a large file runs for minutes.
quarkus.rest-client.file-ingestion.url=${vendor-exchange.file-ingestion.url}
quarkus.rest-client.file-ingestion.scope=jakarta.inject.Singleton
quarkus.rest-client.file-ingestion.connect-timeout=5000
quarkus.rest-client.file-ingestion.read-timeout=120000

# User lookup cache (UserAuthCacheService). Only successful lookups are stored.
quarkus.cache.caffeine."user-by-email".expire-after-write=${vendor-exchange.auth.cache-ttl}
quarkus.cache.caffeine."user-by-email".maximum-size=${vendor-exchange.auth.cache-max-size}

# OpenAPI. The document served at /q/openapi is also written at build time (build.gradle sets the
# store directory for quarkusBuild only) and compared with the committed openapi/openapi.yaml by
# the verifyOpenApi task, so a contract change is always a reviewed diff.
quarkus.smallrye-openapi.info-title=vendor-exchange-service
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Directory accuracy vendor exchange: scheduled practitioner export to an accuracy vendor, and later ingestion of the vendor's response.
# No auto-added localhost servers in the document; the deployed hostname is a deployment fact, not a contract.
quarkus.smallrye-openapi.auto-add-server=false
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=platform-token
quarkus.smallrye-openapi.security-scheme-description=Auth0 platform access token. The tenant-id header selects the tenant.

# JobRunr. Storage is the quarkus-mongodb-client bean above; no separate storage-provider artifact.
quarkus.jobrunr.database.type=mongodb
quarkus.jobrunr.database.database-name=vendor_exchange
# JobRunr names its Mongo collections jobs, recurring_jobs, background_job_servers, metadata and
# migrations with no prefix by default. The prefix gives them the jobrunr_ names the design doc uses
# and marks ownership beside the vendor_export_* collections in the same database.
quarkus.jobrunr.database.table-prefix=jobrunr_
quarkus.jobrunr.jobs.default-number-of-retries=${vendor-exchange.job-retries}
quarkus.jobrunr.miscellaneous.allow-anonymous-data-usage=false
quarkus.jobrunr.background-job-server.enabled=false
quarkus.jobrunr.background-job-server.worker-count=4
quarkus.jobrunr.background-job-server.poll-interval-in-seconds=15
quarkus.jobrunr.dashboard.enabled=false
%worker.quarkus.jobrunr.background-job-server.enabled=true
# Dashboard on the worker only, on an internal port that no firewall rule exposes; reached through
# an IAP SSH tunnel (make tunnel-dashboard, Step 8). The worker test profile turns it back off.
%worker.quarkus.jobrunr.dashboard.enabled=true
%worker.quarkus.jobrunr.dashboard.port=8000

# vendor-exchange.* : required keys (no default in VendorExchangeConfig; the boot fails without them)
vendor-exchange.egress.url=${EGRESS_URL}
vendor-exchange.egress.iap-client-id=${EGRESS_IAP_CLIENT_ID}
vendor-exchange.vendor-bucket=${VENDOR_BUCKET}
vendor-exchange.dal.url=${DAL_URL}
vendor-exchange.dal.iap-client-id=${DAL_IAP_CLIENT_ID}
vendor-exchange.api-layer.url=${API_LAYER_URL}
vendor-exchange.ingestion.archive-bucket=${INGESTION_ARCHIVE_BUCKET}
vendor-exchange.file-ingestion.url=${FILE_INGESTION_URL}

# vendor-exchange.* : defaults that the deployment may override
vendor-exchange.enabled=${VENDOR_EXCHANGE_ENABLED:true}
vendor-exchange.job-retries=${JOB_RETRIES:8}
vendor-exchange.reconciler-stale-minutes=${RECONCILER_STALE_MINUTES:30}
vendor-exchange.egress.deadline-hours=${EGRESS_DEADLINE_HOURS:6}
vendor-exchange.egress.abandon-hours=${EGRESS_ABANDON_HOURS:48}
vendor-exchange.permissions.enforce=${PERMISSIONS_ENFORCE:false}
vendor-exchange.auth.cache-ttl=${AUTH_CACHE_TTL:PT5M}
vendor-exchange.auth.cache-max-size=${AUTH_CACHE_MAX_SIZE:1000}
vendor-exchange.ingestion.ingestion-deadline-hours=${INGESTION_DEADLINE_HOURS:6}
vendor-exchange.ingestion.stage-chunk-rows=${STAGE_CHUNK_ROWS:500}
vendor-exchange.ingestion.review-page-limit-max=${REVIEW_PAGE_LIMIT_MAX:200}
vendor-exchange.ingestion.rejected-value-ttl-months=${REJECTED_VALUE_TTL_MONTHS:12}
vendor-exchange.ingestion.release-read-back-deadline-minutes=${RELEASE_READBACK_DEADLINE_MINUTES:30}
vendor-exchange.ingestion.release-bulk-max=${RELEASE_BULK_MAX:5000}
vendor-exchange.ingestion.inbound-stale-minutes=${INBOUND_STALE_MINUTES:30}
vendor-exchange.ingestion.completeness-signal=${COMPLETENESS_SIGNAL:DATA_FILE}
vendor-exchange.file-ingestion.consumer-identifier=${FILE_INGESTION_CONSUMER_IDENTIFIER:vendor-ingestion}

# vendor-exchange.* : swap-in points (plan section 2). Empty means absent: SmallRye maps an empty
# value to Optional.empty(), asserted by VendorExchangeConfigTest.
vendor-exchange.api-layer.client-id=${API_LAYER_CLIENT_ID:}
vendor-exchange.api-layer.client-secret=${API_LAYER_CLIENT_SECRET:}
vendor-exchange.api-layer.iap-audience=${API_LAYER_IAP_AUDIENCE:}
vendor-exchange.pubsub.push-service-account=${PUBSUB_PUSH_SERVICE_ACCOUNT:}
vendor-exchange.pubsub.push-audience=${PUBSUB_PUSH_AUDIENCE:}
vendor-exchange.file-ingestion.mapping-id=${FILE_INGESTION_MAPPING_ID:}
vendor-exchange.file-ingestion.iap-audience=${FILE_INGESTION_IAP_AUDIENCE:}
